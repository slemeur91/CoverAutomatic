name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          # Deps are pinned inline below, so key the uv cache on this workflow file
          cache-dependency-glob: ".github/workflows/ci.yml"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install ruff
        run: |
          uv venv
          uv pip install ruff==0.14.10

      - name: Ruff check
        run: |
          source .venv/bin/activate
          ruff check custom_components/cover_automatic/ tests/ --output-format=github

      - name: Complexity cap
        # ruff.toml keeps new code at 15; the older functions marked
        # "noqa: C901" may not grow past the current maximum either.
        run: |
          source .venv/bin/activate
          ruff check custom_components/cover_automatic/ tests/ --select C901 \
            --config "lint.mccabe.max-complexity=35" --ignore-noqa --output-format=github

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
        # Minimum version declared in hacs.json + current pin
        homeassistant-version: ["2026.3.0", "2026.9.1"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          # Deps are pinned inline below, so key the uv cache on this workflow file
          cache-dependency-glob: ".github/workflows/ci.yml"

      - name: Set up Python
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: uv python install "$PYTHON_VERSION"

      - name: Install dependencies
        env:
          HA_VERSION: ${{ matrix.homeassistant-version }}
        run: |
          uv venv
          uv pip install pytest==9.1.1 pytest-asyncio==1.4.0 "homeassistant==$HA_VERSION"

      - name: Syntax check
        run: |
          source .venv/bin/activate
          python -m py_compile custom_components/cover_automatic/*.py

      - name: Run tests
        run: |
          source .venv/bin/activate
          python -m pytest tests/ -v --tb=short

  frontend:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          cache-dependency-glob: ".github/workflows/ci.yml"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install Playwright and Chromium
        run: |
          uv venv
          uv pip install pytest==9.1.1 playwright==1.55.0
          source .venv/bin/activate
          python -m playwright install --with-deps chromium

      - name: Panel and card tests
        env:
          # Fail instead of skipping when the browser is missing
          REQUIRE_BROWSER: "1"
        run: |
          source .venv/bin/activate
          python -m pytest tests/frontend --confcutdir=tests/frontend -v --tb=short

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: HACS Validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # home-assistant/actions publishes no tags; @master is the documented ref
      - name: Hassfest Validation
        uses: home-assistant/actions/hassfest@master
